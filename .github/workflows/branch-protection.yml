name: Branch Protection

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Branch State
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for local-only files
        run: bash scripts/git/check_local_files.sh

      - name: Verify .gitattributes exists
        run: |
          if [ ! -f .gitattributes ]; then
            echo "ERROR: .gitattributes not found — required for LF line ending enforcement"
            exit 1
          fi
          echo ".gitattributes found"

      - name: Check Bats skipped test count ratchet
        run: bash tests/check_skipped_bats.sh

  lint:
    name: Shell Script Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install ShellCheck & shfmt
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          curl -sSL "https://github.com/mvdan/sh/releases/download/v3.13.0/shfmt_v3.13.0_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: ShellCheck production scripts
        id: sc_scripts
        run: shellcheck -x --severity=error --source-path=scripts/git scripts/git/*.sh
        continue-on-error: true

      - name: ShellCheck hooks
        id: sc_hooks
        run: shellcheck -x --severity=error --source-path=hooks hooks/pre-commit hooks/pre-push hooks/*.sh
        continue-on-error: true

      - name: ShellCheck Bats test files
        id: sc_tests
        run: shellcheck --shell=bash --severity=error tests/unit/*.bats tests/integration/*.bats
        continue-on-error: true

      - name: Check shell formatting (shfmt)
        id: shfmt_check
        run: shfmt -d -i 2 -ci scripts/ hooks/
        continue-on-error: true

      - name: Lint documentation code snippets
        id: doc_snippets
        run: bash tests/lint_doc_snippets.sh
        continue-on-error: true

      - name: Verify skill and command documentation sync
        id: verify_commands
        run: bash tests/verify_skill_commands.sh
        continue-on-error: true

      - name: Aggregate lint verdict
        run: |
          failed=0
          if [ "${{ steps.sc_scripts.outcome }}" != "success" ]; then
            echo "::error::ShellCheck failed on scripts/git/"
            failed=1
          fi
          if [ "${{ steps.sc_hooks.outcome }}" != "success" ]; then
            echo "::error::ShellCheck failed on hooks/"
            failed=1
          fi
          if [ "${{ steps.sc_tests.outcome }}" != "success" ]; then
            echo "::error::ShellCheck failed on tests/"
            failed=1
          fi
          if [ "${{ steps.shfmt_check.outcome }}" != "success" ]; then
            echo "::warning::shfmt format differences found in scripts/ or hooks/ (run shfmt -w -i 2 -ci scripts/ hooks/)"
          fi
          if [ "${{ steps.doc_snippets.outcome }}" != "success" ]; then
            echo "::error::Documentation snippet linting failed"
            failed=1
          fi
          if [ "${{ steps.verify_commands.outcome }}" != "success" ]; then
            echo "::error::Skill/command script flag verification failed"
            failed=1
          fi
          exit $failed

  test:
    name: Run Test Suite (${{ matrix.batch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [fast, slow]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Install bats-core and helpers
        run: |
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
          git clone --depth 1 --branch v0.3.0 https://github.com/bats-core/bats-support.git /tmp/bats-support
          git clone --depth 1 --branch v2.2.4 https://github.com/bats-core/bats-assert.git /tmp/bats-assert

      - name: Configure git identity for test repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Test"

      - name: Run ${{ matrix.batch }} test batch
        run: CGW_TEST_JOBS=4 bash tests/run.sh --${{ matrix.batch }}

  all-gates-green:
    name: all-gates-green
    runs-on: ubuntu-latest
    needs: [validate, lint, test]
    if: always()
    steps:
      - name: Decide aggregate outcome
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::One or more required pipeline gates did not succeed"
            echo "validate: ${{ needs.validate.result }}"
            echo "lint:     ${{ needs.lint.result }}"
            echo "test:     ${{ needs.test.result }}"
            exit 1
          fi
          echo "All pipeline gates green."
