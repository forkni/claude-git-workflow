name: Nightly Maintenance & Cross-Platform Regression

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Scheduled and manual runs queue behind each other instead of cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    name: Full Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The Windows leg is the slow one: its fast batch alone took 20+ minutes on a PR runner.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install ShellCheck (Linux only) and bats-core
        uses: ./.github/actions/setup-shell-tools
        with:
          shellcheck: 'true'
          bats: 'true'

      - name: Configure git identity
        run: |
          git config --global user.email "nightly-ci@example.com"
          git config --global user.name "Nightly CI"

      - name: Run complete test suite (--all)
        run: CGW_TEST_JOBS=4 bash tests/run.sh --all

  doc-link-audit:
    name: Full Documentation Link Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Comprehensive link audit
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: |
            --verbose
            --no-progress
            '**/*.md'

  tooling-drift:
    name: Tooling & Documentation Drift Canary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Deliberately the distro's unpinned ShellCheck: the PR gate pins a version via
      # setup-shell-tools, so this canary surfaces drift from whatever apt ships.
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Lint documentation code snippets
        run: bash tests/lint_doc_snippets.sh

      - name: Verify skill and command documentation sync
        run: bash tests/verify_skill_commands.sh

      - name: Check Bats skipped test count ratchet
        run: bash tests/check_skipped_bats.sh
